<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Entrar — MACVET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/panel.css" />
</head>
<body class="pagina-acceso">
  <main class="acceso">
    <div class="acceso-tarjeta">
      <div class="brand acceso-brand">
        <div class="brand-mark"><svg class="ico-brand" viewBox="0 0 24 24" fill="currentColor"><ellipse cx="6" cy="5.5" rx="2.2" ry="2.8"/><ellipse cx="18" cy="5.5" rx="2.2" ry="2.8"/><ellipse cx="3" cy="12" rx="2" ry="2.6"/><ellipse cx="21" cy="12" rx="2" ry="2.6"/><path d="M12 10c-3.5 0-6 3-6 5.5 0 2 1.5 3.5 3.5 3.5 1 0 1.8-.4 2.5-.4s1.5.4 2.5.4c2 0 3.5-1.5 3.5-3.5 0-2.5-2.5-5.5-6-5.5z"/></svg></div>
        <div>MACVET<small>Sistema de gestión veterinaria</small></div>
      </div>
      <h1>Iniciar sesión</h1>
      <form id="form-acceso" novalidate>
        <div class="form-group">
          <label for="usuario">Usuario o correo</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
        </div>
        <div class="form-group">
          <label for="clave">Contraseña</label>
          <input id="clave" name="clave" type="password" autocomplete="current-password" required />
        </div>
        <div class="form-error" id="error-acceso" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary btn-lg" id="btn-entrar" style="width:100%">Entrar</button>
      </form>
      <p class="acceso-pie"><a href="#" id="olvide">¿Olvidaste tu contraseña?</a></p>
      <p class="acceso-pie"><a href="index.html">← Volver al sitio</a></p>
    </div>
  </main>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
