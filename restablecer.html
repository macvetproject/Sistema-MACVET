<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Nueva contraseña — MACVET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/panel.css" />
</head>
<body class="pagina-acceso">
  <main class="acceso">
    <div class="acceso-tarjeta">
      <h1>Crear nueva contraseña</h1>
      <p class="ayuda" id="estado-enlace">Verificando el enlace…</p>
      <form id="form-nueva" novalidate hidden>
        <div class="form-group"><label for="c1">Nueva contraseña</label><input id="c1" type="password" autocomplete="new-password" required /><small class="ayuda">Mínimo 10 caracteres, con letras y números.</small></div>
        <div class="form-group"><label for="c2">Repite la contraseña</label><input id="c2" type="password" autocomplete="new-password" required /></div>
        <div class="form-error" id="error-nueva" role="alert" hidden></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%">Guardar contraseña</button>
      </form>
      <p class="acceso-pie"><a href="login.html">← Ir a iniciar sesión</a></p>
    </div>
  </main>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/restablecer.js"></script>
</body>
</html>
